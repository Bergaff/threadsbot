# Git Builds в Cloudflare:
# Build command: npm run build
# Deploy command: npx wrangler deploy
# Смена production branch САМА не деплоит — нужен новый коммит или Retry build.
# Поле main ниже — входной файл воркера, это НЕ git-ветка.
name = "threadsbot"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"

[[d1_databases]]
binding = "DB"
database_name = "threadsbot"
database_id = "831162d2-03cc-4525-a4b8-0651e2c20e61"
migrations_dir = "migrations"

[[queues.producers]]
binding = "UPDATES"
queue = "threadsbot-updates"

[[queues.consumers]]
queue = "threadsbot-updates"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 3
max_concurrency = 1

[triggers]
crons = ["0 */6 * * *"] # очистка + самодиагностика cookies каждые 6ч

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1


[vars]
ADMIN_IDS = "369330135,657708753"
STATS_EXCLUDE_IDS = "369330135,657708753"
BASE_URL = "https://www.threads.com"
SITE_URL = "https://threadsviewer.online"
SITE_DOMAIN = "threadsviewer.online"
VERSION = "pr94-2026-11-23-yandex-rtb"
BOT_USERNAME = "threadsreaderbot"
# Касса RollyPay (оплата картой/СБП). UUID кассы не секрет.
# Секреты задаются командами: npx wrangler secret put ROLLYPAY_API_KEY / ROLLYPAY_SIGNING_SECRET
ROLLYPAY_TERMINAL_ID = "60da0dc8-409e-478e-aa01-51a106a3ca64"
JHPAY_TOKEN = "940e2c5aec5bf97eab483ac86c07c0db"
# Как часто прогревать каждый аккаунт, чтобы Meta продлевала sessionid.
# Меньше значение - сессии живут дольше, но больше запусков браузера.
KEEPALIVE_HOURS = "12"
# Номер счётчика Яндекс Метрики (metrika.yandex.ru -> Добавить счётчик). Пусто - счётчика на сайте нет.
# Нужен Рекламной сети Яндекса: без него Яндекс не видит посетителей сайта.
YANDEX_METRIKA_ID = "114284988"
# Рекламная сеть Яндекса: у каждого места свой блок (один блок - один раз на странице). Пусто - места нет.
YANDEX_RTB_MAIN = "R-A-20435188-1"
YANDEX_RTB_LEFT = ""
YANDEX_RTB_RIGHT = ""

# Custom domain
[[routes]]
pattern = "threadsviewer.online"
custom_domain = true

[[routes]]
pattern = "www.threadsviewer.online"
custom_domain = true
