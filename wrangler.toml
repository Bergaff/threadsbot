# Git Builds в Cloudflare:
# Build command: npm run build
# Deploy command: npx wrangler deploy
# Смена production branch САМА не деплоит — нужен новый коммит или Retry build.
# Поле main ниже — входной файл воркера, это НЕ git-ветка.
name = "threadsbot"
main = "src/index.ts"
compatibility_date = "2026-08-15"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "BROWSER"

[[d1_databases]]
binding = "DB"
database_name = "threadsbot"
database_id = "831162d2-03cc-4525-a4b8-0651e2c20e61"
migrations_dir = "migrations"

[[queues.producers]]
binding = "UPDATES"
queue = "threadsbot-updates"

[[queues.consumers]]
queue = "threadsbot-updates"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 3
max_concurrency = 1

[triggers]
crons = ["0 */6 * * *"] # очистка + самодиагностика cookies каждые 6ч

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1


[vars]
ADMIN_IDS = "369330135,657708753"
STATS_EXCLUDE_IDS = "369330135,657708753"
BASE_URL = "https://www.threads.com"
VERSION = "pr5-2026-08-21-expiry"
